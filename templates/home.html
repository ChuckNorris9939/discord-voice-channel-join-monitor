<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Status</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 80px); background-color: #f4f4f4; color: #333; }

        .button:hover { background-color: #0056b3; }

    <div class="container">
        <h1>Bot Status</h1>

        <a href="{{ url_for('view_join_logs_page') }}" class="button">View Join Logs</a>

</html>
