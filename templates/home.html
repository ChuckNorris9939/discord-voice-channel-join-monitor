<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Status</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: calc(100vh - 80px); 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
        }
        .container { 
            text-align: center; 
            padding: 20px; 
            background-color: #2d2d2d; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); 
            border: 1px solid #404040;
        }
        h1 { color: #ffffff; }
        p { color: #cccccc; margin-bottom: 20px; }
        .button { 
            display: block; 
            width: 200px; 
            padding: 10px 20px; 
            font-size: 16px; 
            color: #fff; 
            background-color: #007bff; 
            text-decoration: none; 
            border-radius: 5px; 
            transition: background-color 0.3s; 
            margin: 5px auto; 
        }
        .button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bot Status</h1>
        <p>Bot ist online!</p>
        <p>Version: {{ bot_version }}</p>
        <a href="{{ url_for('view_join_logs_page') }}" class="button">View Join Logs</a>
        <a href="{{ url_for('garmin_recordings_page') }}" class="button">Garmin Recordings</a>
        <a href="{{ url_for('settings_route') }}" class="button">Bot Settings</a>
    </div>
</body>
</html>
