<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bot Settings</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="checkbox"] { margin-right: 5px; }
        .token-display { 
            background-color: #f0f0f0; 
            padding: 8px; 
            border-radius: 4px; 
            font-family: monospace;
            margin-bottom: 5px;
        }
        .note { font-size: 0.9em; color: #666; margin-top: 5px; }
        .button-group button { padding: 10px 15px; margin-right: 10px; border: none; border-radius: 4px; cursor: pointer; }
        .save-button { background-color: #4CAF50; color: white; }
        .restart-button { background-color: #f44336; color: white; }
        .home-link { margin-top: 20px; display: inline-block; }
    </style>
</head><body>
    <div class="container">
        <h1>Bot Settings</h1>

        {% if message %}
            <p style="color: green;">{{ message }}</p>
        {% endif %}
        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('settings_route') }}">
            <h2>Settings</h2>
            <!-- App Testing Mode -->
            <div class="form-group">
                <label for="app_testing_mode">App Testing Mode</label>
                <select name="app_testing_mode" id="app_testing_mode">
                    <option value="true" {% if current_settings.get('APP_TESTING_MODE') == 'true' %}selected{% endif %}>True</option>
                    <option value="false" {% if current_settings.get('APP_TESTING_MODE') == 'false' %}selected{% endif %}>False</option>
                </select>
            </div>
            <!-- Join Message Timer -->
            <div class="form-group">
                <label>Summarized Join Messages</label>
                <select name="join_message_timer_enabled" id="join_message_timer_enabled">
                    <option value="true" {% if current_settings.get('JOIN_MESSAGE_TIMER_ENABLED') == 'true' %}selected{% endif %}>Enabled</option>
                    <option value="false" {% if current_settings.get('JOIN_MESSAGE_TIMER_ENABLED') == 'false' %}selected{% endif %}>Disabled</option>
                </select>
            </div>

            <div class="form-group">
                <label for="log_level">Log Level</label>
                <select name="log_level" id="log_level">
                    <option value="DEBUG" {% if current_settings.get('LOG_LEVEL') == 'DEBUG' %}selected{% endif %}>DEBUG</option>
                    <option value="INFO" {% if current_settings.get('LOG_LEVEL') == 'INFO' %}selected{% endif %}>INFO</option>
                    <option value="WARNING" {% if current_settings.get('LOG_LEVEL') == 'WARNING' %}selected{% endif %}>WARNING</option>
                    <option value="ERROR" {% if current_settings.get('LOG_LEVEL') == 'ERROR' %}selected{% endif %}>ERROR</option>
                    <option value="CRITICAL" {% if current_settings.get('LOG_LEVEL') == 'CRITICAL' %}selected{% endif %}>CRITICAL</option>
                </select>
            </div>

            <h2>Garmin Recorder Settings</h2>
            <!-- STT Enabled -->
            <div class="form-group">
                <label for="stt_enabled">STT Enabled</label>
                <select name="stt_enabled" id="stt_enabled">
                    <option value="true" {% if current_settings.get('STT_ENABLED') == 'true' %}selected{% endif %}>True</option>
                    <option value="false" {% if current_settings.get('STT_ENABLED') == 'false' %}selected{% endif %}>False</option>
                </select>
            </div>
            <!-- STT Engine -->
            <div class="form-group">
                <label for="stt_engine">STT Engine</label>
                <select name="stt_engine" id="stt_engine">
                    <option value="google" {% if current_settings.get('STT_ENGINE') == 'google' %}selected{% endif %}>Google</option>
                    <option value="vosk" {% if current_settings.get('STT_ENGINE') == 'vosk' %}selected{% endif %}>Vosk</option>
                </select>
            </div>
            <!-- Vosk Model Path -->
            <div class="form-group">
                <label for="vosk_model_path">Vosk Model Path</label>
                <input type="text" name="vosk_model_path" id="vosk_model_path" value="{{ current_settings.get('VOSK_MODEL_PATH', '') }}">
            </div>
            <!-- Garmin Auto Join Enabled -->
            <div class="form-group">
                <label for="garmin_auto_join_enabled">Garmin Auto Join Enabled</label>
                <select name="garmin_auto_join_enabled" id="garmin_auto_join_enabled">
                    <option value="true" {% if current_settings.get('GARMIN_AUTO_JOIN_ENABLED') == 'true' %}selected{% endif %}>True</option>
                    <option value="false" {% if current_settings.get('GARMIN_AUTO_JOIN_ENABLED') == 'false' %}selected{% endif %}>False</option>
                </select>
            </div>
            <!-- Garmin Auto Join Channels -->
            <div class="form-group">
                <label for="garmin_auto_join_channels">Garmin Auto Join Channels (comma-separated IDs)</label>
                <input type="text" name="garmin_auto_join_channels" id="garmin_auto_join_channels" value="{{ current_settings.get('GARMIN_AUTO_JOIN_CHANNELS', '') }}">
            </div>
            <!-- Garmin Record Seconds -->
            <div class="form-group">
                <label for="garmin_record_seconds">Garmin Record Seconds</label>
                <input type="number" name="garmin_record_seconds" id="garmin_record_seconds" value="{{ current_settings.get('GARMIN_RECORD_SECONDS', '600') }}" min="1" style="width: 100px;">
            </div>
            <!-- Garmin Max Recording Duration -->
            <div class="form-group">
                <label for="garmin_max_recording_duration">Garmin Max Recording Duration</label>
                <input type="number" name="garmin_max_recording_duration" id="garmin_max_recording_duration" value="{{ current_settings.get('GARMIN_MAX_RECORDING_DURATION', '3600') }}" min="1" style="width: 100px;">
            </div>

            <h2>Timer settings</h2>
            <!-- Purge Older Than Days -->
            <div class="form-group">
                <label for="purge_older_than_days">Purge Messages Older Than (Days)</label>
                <input type="number" name="purge_older_than_days" id="purge_older_than_days" value="{{ current_settings.get('PURGE_OLDER_THAN_DAYS', '7') }}" min="1" max="14" style="width: 100px;">
                <p class="note">Discord API limits bulk deletion to messages not older than 14 days.</p>
            </div>

            <div class="form-group">
                <label for="join_message_timer_minutes">Join Message Timer (Minutes)</label>
                <input type="number" name="join_message_timer_minutes" id="join_message_timer_minutes" value="{{ current_settings.get('JOIN_MESSAGE_TIMER_MINUTES', '7') }}" min="1" style="width: 100px;">
            </div>

            <div class="form-group">
                <label for="afk_timer_minutes">AFK Timer (Minutes)</label>
                <input type="number" name="afk_timer_minutes" id="afk_timer_minutes" value="{{ current_settings.get('AFK_TIMER_MINUTES', '10') }}" min="1" style="width: 100px;">
            </div>

            <h2>Channel IDs</h2>
            <!-- Hidden Channels -->
            <div class="form-group">
                <label for="hidden_channels">Hidden Channels (comma-separated IDs)</label>
                <input type="text" name="hidden_channels" id="hidden_channels" value="{{ current_settings.get('HIDDEN_CHANNELS', '') }}">
            </div>

            <!-- Log Channel ID -->
            <div class="form-group">
                <label for="log_channel_id">Log Channel ID</label>
                <input type="text" name="log_channel_id" id="log_channel_id" value="{{ current_settings.get('LOG_CHANNEL_ID', '') }}">
            </div>
            
            <!-- Bot Audit ID -->
            <div class="form-group">
                <label for="bot_audit_id">Bot Audit ID</label>
                <input type="text" name="bot_audit_id" id="bot_audit_id" value="{{ current_settings.get('BOT_AUDIT_ID', '') }}">
            </div>

            <!-- Tech Support Channel ID -->
            <div class="form-group">
                <label for="techsupport_channel_id">Tech Support Channel ID (Forum)</label>
                <input type="text" name="techsupport_channel_id" id="techsupport_channel_id" value="{{ current_settings.get('TECHSUPPORT_CHANNEL_ID', '') }}">
            </div>

            <!-- AFK Channel ID -->
            <div class="form-group">
                <label for="afk_channel_id">AFK Channel ID</label>
                <input type="text" name="afk_channel_id" id="afk_channel_id" value="{{ current_settings.get('AFK_CHANNEL_ID', '') }}">
            </div>

            <div class="button-group">
                <button type="submit" class="save-button">Save Settings</button>
                <button type="button" class="restart-button" onclick="alert('Restart functionality to be implemented. This may trigger a bot shutdown.');">Restart Bot (Requires Setup)</button>
            </div>
        </form>
        <a href="{{ url_for('home') }}" class="home-link">Back to Home</a>
    </div>
</body>
</html>
